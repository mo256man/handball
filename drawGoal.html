<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG Goal</title>
  <style>
    body { margin: 0; padding: 20px; background: #f5f5f5; }
    svg { display: block; background: #ffffff; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <svg id="s" width="400" height="300" viewBox="0 0 400 300"></svg>

  <script>
    const svgWidth = 400, svgHeight = 300;
    const goalWidth = 300, goalHeight = 200;  // ゴールのサイズは内寸（ポスト太さを含まない）
    const thickness = 20;

    const x0 = (svgWidth - goalWidth)/2;
	const y0 = 250;

    const svg = document.getElementById("s");
    const NS = "http://www.w3.org/2000/svg";

    const el = (tag, attrs) => {
      const node = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
      return node;
    };

    const addRect = (x, y, w, h, fill, stroke = null, sw = null) => {
      const attrs = { x, y, width: w, height: h, fill };
      if (stroke != null) attrs.stroke = stroke;
      if (sw != null) attrs["stroke-width"] = sw;
      svg.appendChild(el("rect", attrs));
    };

    const addDashedLine = (x1, y1, x2, y2, w = thickness, color = "#000", dash = "20 20", offset = 0) => {
      svg.appendChild(el("line", {
        x1, y1, x2, y2,
        stroke: color,
        "stroke-width": w,
        "stroke-dasharray": dash,
        "stroke-dashoffset": offset
      }));
    };

    svg.setAttribute("width", svgWidth);
    svg.setAttribute("height", svgHeight);
    svg.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);


    // 地面
    addRect(0, y0, svgWidth, svgHeight - y0, "#F5DEB3");

    // 空
    addRect(0, 0, svgWidth, y0, "#87CEEB");

    // ゴール内
    addRect(x0, y0-goalHeight, goalWidth, goalHeight, "#D3D3D3");

    // ゴール
    const points = [
      [x0, y0],
      [x0, y0 - goalHeight],
      [x0 + goalWidth, y0 - goalHeight],
      [x0 + goalWidth, y0],
      [x0 + goalWidth + thickness, y0],
      [x0 + goalWidth + thickness, y0 - goalHeight - thickness],
      [x0 - thickness, y0 - goalHeight - thickness],
      [x0 - thickness, y0],
      [x0, y0],
    ].map(([x, y]) => `${x},${y}`).join(" ");

    svg.appendChild(el("polygon", {
      points,
      fill: "#ffffff",
      stroke: "#000000",
      "stroke-width": 1
    }));


	// 角の黒四角（左右）
	const topY = y0 - goalHeight - thickness;
	[
	  [x0 - thickness, topY],
	  [x0 + goalWidth, topY],
	].forEach(([x, y]) => addRect(x, y, thickness, thickness, "#000000"));

	// 点線の縦線2本（y0から上に）
	[
	  x0 - thickness / 2,
	  x0 + goalWidth + thickness / 2,
	].forEach((x) =>
	  addDashedLine(x, y0, x, y0 - goalHeight, thickness, "#000", "20 20", 20)
	);


    // 点線の横線（黒から開始、x0+thicknessから右にgoalWidth）
    const hy = y0 - goalHeight - thickness / 2;
    const hx1 = x0;
    const hx2 = hx1 + goalWidth;
    addDashedLine(hx1, hy, hx2, hy, thickness, "#000", "20 20", 0);
  </script>
</body>
</html>
