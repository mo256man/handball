<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WiFi / AP Status</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    /* --bh is 1% of the body height in px (set by script below) */
    :root { --bh: 1vh; }
    body { font-family: Arial, Helvetica, sans-serif; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
    h1 { font-size: calc(var(--bh) * 6); margin: 0 0 calc(var(--bh) * 1.6); text-align: center; }
    .card { border: 1px solid #ddd; padding: calc(var(--bh) * 4); border-radius: 8px; max-width: 1100px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: calc(var(--bh) * 1.2); }
    .label { color: #666; font-size: calc(var(--bh) * 2); }
    .value { font-size: calc(var(--bh) * 4); margin-top: calc(var(--bh) * 0.6); word-break: break-word; text-align: center; }
    button#refresh { font-size: calc(var(--bh) * 2.2); padding: calc(var(--bh) * 0.8) calc(var(--bh) * 1.8); }
  </style>
  <script>
    (function setBodyHeightUnit(){
      function updateBH(){
        var bh = document.body.clientHeight / 100;
        document.documentElement.style.setProperty('--bh', bh + 'px');
      }
      updateBH();
      window.addEventListener('resize', updateBH);
      window.addEventListener('orientationchange', updateBH);
      if (window.ResizeObserver) {
        new ResizeObserver(function(){ updateBH(); }).observe(document.body);
      }
    })();
  </script>
</head>
<body>
  <h1>Network Mode / SSID</h1>
  <div class="card">
    <div class="label">Mode</div>
    <div id="mode" class="value">--</div>
    <div class="label" style="margin-top:12px;">SSID</div>
    <div id="ssid" class="value">--</div>
    <div class="label" style="margin-top:12px;">IPs</div>
    <div id="ips" class="value">--</div>
    <div class="label" style="margin-top:12px;">ここにアクセス</div>
    <div id="access" class="value">--</div>
    <div style="margin-top:12px;"><button id="refresh">Refresh</button></div>
  </div>

  <script>
    async function update() {
      try {
        const r = await fetch('/api/wifi');
        const j = await r.json();
        if (j && j.success) {
          document.getElementById('mode').textContent = j.mode || 'unknown';
          document.getElementById('ssid').textContent = j.ssid || '-';
          const ipsText = (j.mode === 'ap' && j.ips && j.ips.length) ? j.ips.join(', ') : '-';
          document.getElementById('ips').textContent = ipsText;
          const ipForUrl = (j.mode === 'ap' && j.ips && j.ips.length) ? j.ips[0] : null;
          if (ipForUrl) {
            document.getElementById('access').innerHTML = `http://${ipForUrl}:5173/`;
          } else {
            document.getElementById('access').textContent = j.access || '-';
          }
        } else {
          document.getElementById('mode').textContent = 'unknown';
          document.getElementById('ssid').textContent = '-';
          document.getElementById('ips').textContent = '-';
          document.getElementById('access').textContent = '-';
        }
      } catch (e) {
        document.getElementById('mode').textContent = 'error';
        document.getElementById('ssid').textContent = '-';
        document.getElementById('ips').textContent = '-';
        document.getElementById('access').textContent = '-';
      }
    }
    document.getElementById('refresh').addEventListener('click', update);
    update();
  </script>
</body>
</html>
