<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scale Main</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
  	  background: linear-gradient(to bottom, #1e90ff, #0b1a33);
    }

    /* 設計サイズはCSSに集約 */
    #myMain {
      width: 1280px;
      height: 640px; /* ここを変更すれば基準サイズも変わる */
      background: lightgreen;
      border: 4px solid #000;
      box-sizing: border-box;

      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;

      overflow: hidden;
    }

    #square {
      position: absolute;
      left: 40px;
      top: 40px;
      width: 300px;
      height: 300px;
      background: #2d8cff;
      border: 3px solid #000;
      box-sizing: border-box;
      font-size: large;
    }
  </style>
</head>
<body>
  <div id="myMain">
    <div id="square">ABC<br>DEF</div>
  </div>

  <script>
    (function () {
      const main = document.getElementById("myMain");

      function getViewport() {
        const vv = window.visualViewport;
        let w = vv ? vv.width : window.innerWidth;
        let h = vv ? vv.height : window.innerHeight;
        if (!w || !h) {
          w = window.innerWidth;
          h = window.innerHeight;
        }
        return { w, h };
      }

      // CSSで指定した#myMainのwidth/height(px)を基準サイズとして読む
      function getBaseSize() {
        const cs = getComputedStyle(main);
        const baseW = parseFloat(cs.width) || main.clientWidth;
        const baseH = parseFloat(cs.height) || main.clientHeight;
        return { baseW, baseH };
      }

      function fit() {
        const vp = getViewport();
        const base = getBaseSize();
        const s = Math.min(vp.w / base.baseW, vp.h / base.baseH);
        main.style.setProperty("--scale", String(s));
      }

      fit();
      window.addEventListener("resize", fit, { passive: true });
      window.addEventListener("orientationchange", fit, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fit, { passive: true });
        window.visualViewport.addEventListener("scroll", fit, { passive: true });
      }
    })();
  </script>
</body>
</html>
